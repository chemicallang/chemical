name: Benchmark Backfill (Releases)

# Historical release backfill: for the last N releases, download the shipped
# compiler binaries and run hello + module benchmarks + the FULL test suite on
# every platform build-and-release ships. No compiler is ever built here — the
# binaries come straight from the release assets.
#
# Fault tolerance is built in: a missing asset, a compiler that crashes, or a
# test suite that fails is recorded AS DATA (bench-collect-release.sh writes
# missing_asset / benchmark_failure / test_failure records) — the job never
# fails because one release is broken. With ~10-20 releases and many of them
# missing assets, the whole backfill stays quick.

on:
  workflow_dispatch:
    inputs:
      release_count:
        description: 'Number of most recent releases to backfill (newest first)'
        required: false
        type: number
        default: 20

permissions:
  contents: write

concurrency:
  group: benchmark-backfill
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release list
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch the last N release tags
        id: list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT="${{ inputs.release_count }}"
          [ "$COUNT" -lt 1 ] && COUNT=1
          TAGS="$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --argjson n "$COUNT" \
              '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | reverse | .[0:$n] | .[].tag_name' \
            | paste -sd, -)"
          if [ -z "$TAGS" ]; then
            echo "::error::could not resolve any release tags from the GitHub API"
            exit 1
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Resolved $COUNT releases: $TAGS"

  collect:
    name: Backfill ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    # Release jobs download prebuilt binaries (no compiler build); the test
    # suite is ~20 s per backend, so even 20 releases fit easily. The cap is a
    # safety net only.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Mirrors the build-and-release.yml platform matrix exactly, so every
      # binary a release ships gets benchmarked + test-suite'd on the platform
      # it was built for.
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            alpine: false
            workdir: .
            deps: sudo apt-get update && sudo apt-get install -y jq zip unzip
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            alpine: false
            workdir: .
            deps: sudo apt-get update && sudo apt-get install -y jq zip unzip
          - name: alpine-x64
            runner: ubuntu-24.04
            container: alpine:3.20
            platform: linux-alpine
            arch: x64
            alpine: true
            workdir: tooling
            deps: apk add --no-cache bash curl jq zip unzip git coreutils
          - name: alpine-arm64
            runner: ubuntu-24.04-arm
            container: alpine:3.20
            platform: linux-alpine
            arch: arm64
            alpine: true
            workdir: tooling
            deps: apk add --no-cache bash curl jq zip unzip git coreutils
          - name: macos-arm64
            runner: macos-26
            platform: macos
            arch: arm64
            alpine: false
            workdir: .
            deps: brew install jq || true
          - name: macos-x64
            runner: macos-15-intel
            platform: macos
            arch: x64
            alpine: false
            workdir: .
            deps: brew install jq || true
          - name: windows-x64
            runner: windows-2025
            platform: windows
            arch: x64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"
          - name: windows-arm64
            runner: windows-11-arm
            platform: windows
            arch: arm64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"
          - name: windows-mingw-x64
            runner: windows-2025
            platform: windows-mingw
            arch: x64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"
          - name: windows-mingw-arm64
            runner: windows-11-arm
            platform: windows-mingw
            arch: arm64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"
          - name: windows-mingw-msvcrt-x64
            runner: windows-2025
            platform: windows-mingw-msvcrt
            arch: x64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"

    steps:
      - name: Install dependencies
        # No `shell:` key here: the alpine container has no bash until this
        # step installs it, so the runner falls back to the container's sh
        # (same pattern as build-and-release.yml's alpine job).
        run: ${{ matrix.deps }}

      - name: Checkout (default branch — scripts + full history, all tags)
        if: ${{ !matrix.alpine }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Alpine containers have no node (musl), so JS actions like
      # actions/checkout cannot run there. Clone with plain git instead — a
      # FULL clone (no depth) so every release tag is present locally, which
      # bench-collect-release.sh needs to extract each release's own test
      # sources (a compiler from release X can only compile tests of release X).
      - name: Checkout (alpine — plain git, full history for tags)
        if: ${{ matrix.alpine }}
        shell: bash
        run: |
          git clone --quiet "https://github.com/${{ github.repository }}.git" tooling

      - name: Collect release benchmarks
        shell: bash
        working-directory: ${{ matrix.workdir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # alpine runs scripts from the tooling clone; everyone else from the checkout
          TOOL_DIR="$GITHUB_WORKSPACE/scripts"
          if [ "${{ matrix.alpine }}" = "true" ]; then
            TOOL_DIR="$GITHUB_WORKSPACE/tooling/scripts"
          fi
          # alpine only: the collect runs in the tooling working-directory with
          # scripts from tooling/, which would default OUT to tooling/.bench-data
          # — never matching the upload path. Other platforms already default to
          # the workspace root (and on Windows GITHUB_WORKSPACE is a Windows-style
          # path, so do NOT use it in bash for them).
          OUT_ARGS=""
          if [ "${{ matrix.alpine }}" = "true" ]; then OUT_ARGS="--out $GITHUB_WORKSPACE/.bench-data"; fi
          IFS=',' read -ra TAGS <<< "${{ needs.prepare.outputs.tags }}"
          for TAG in "${TAGS[@]}"; do
            [ -z "$TAG" ] && continue
            echo "==> Backfilling release $TAG on ${{ matrix.platform }}/${{ matrix.arch }}"
            # bench-collect-release.sh never exits nonzero for recorded failures
            # (missing asset, download/extract failure, test crash); the `||`
            # guards against unexpected script errors so one broken release can
            # never kill the whole backfill job.
            bash "$TOOL_DIR/bench-collect-release.sh" \
              --tag "$TAG" \
              --platform "${{ matrix.platform }}" \
              --arch "${{ matrix.arch }}" \
              $OUT_ARGS \
              || echo "WARN: release $TAG failed unexpectedly on ${{ matrix.platform }}/${{ matrix.arch }} — continuing"
          done

      - name: Upload release data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-backfill-${{ matrix.name }}
          path: .bench-data/
          # `.bench-data` is a hidden directory (leading dot); upload-artifact
          # silently skips hidden paths unless explicitly included — without
          # this every platform uploads nothing
          include-hidden-files: true
          if-no-files-found: ignore

  publish:
    name: Publish to gh-pages
    needs: [collect]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (default branch — scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release data
        uses: actions/download-artifact@v4
        with:
          path: merged
          merge-multiple: true

      - name: Publish to gh-pages
        run: |
          mkdir -p .bench-data
          # collect uploads `path: .bench-data/` (include-hidden-files), so the
          # artifact root IS the contents of .bench-data/ (releases/ here)
          if [ -d merged/releases ]; then cp -r merged/releases .bench-data/; fi
          bash scripts/bench-push-pages.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
