name: Build Compiler Tests

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test against (e.g. v0.9.0). Leave empty to use the latest release. For debug builds this is the debug release tag (commit SHA or chemical tag).'
        required: false
        type: string
        default: ''
      use_latest_tests:
        description: 'Use test sources from the latest commit instead of the selected release commit.'
        required: false
        type: boolean
        default: false
      use_debug_builds:
        description: 'Build mode. "release" (default) tests the stable releases published to chemicallang/chemical. "debug" tests the DEBUG builds (full debug symbols) published to chemicallang/chemical-debug instead: the compiler runs under gdb/lldb so a crash produces a full backtrace. If the test suite crashes/fails, a crash-dump zip with all collected data is uploaded as an artifact; on success no data is uploaded, only logs. Test sources are taken from the source commit recorded in the debug release.'
        required: false
        type: choice
        default: release
        options:
          - release
          - debug
      deadlock_timeout_minutes:
        description: 'Minutes before a running test suite is assumed to be DEADLOCKED (default 10; the suite never takes this long). On timeout, the process is attached with a debugger and full diagnostics are collected (all-thread backtraces, registers, /proc data) and uploaded.'
        required: false
        type: number
        default: 10

jobs:
  # Always runs first; makes the selected mode (debug vs release) visible in the
  # "All jobs" list and via a notice annotation. Without it, the skipped matrix
  # job's name shows the raw "${{ matrix.* }}" template (GitHub renders skipped
  # matrix job names literally), which looks like a bug.
  setup:
    name: "Mode (${{ inputs.use_debug_builds }})"
    runs-on: ubuntu-latest
    steps:
      - name: Print active mode
        run: |
          MODE=${{ inputs.use_debug_builds }}
          echo "=================================="
          echo "  Build Compiler Tests mode: $MODE"
          echo "=================================="
          if [ "$MODE" = "debug" ]; then
            echo "::notice::Running DEBUG build tests against chemicallang/chemical-debug. The release test jobs are skipped."
          else
            echo "::notice::Running RELEASE build tests against chemicallang/chemical. Set the 'use_debug_builds' input to 'debug' to test debug builds instead."
          fi

  test-linux:
    name: Test on Linux (${{ matrix.arch }})
    if: ${{ inputs.use_debug_builds == 'release' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            asset_suffix: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            asset_suffix: arm64
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMPILER_CMD_REGULAR: "./chemical lang/tests/build.lab -arg-minimal -bm -v --assertions --mode debug_complete"
      COMPILER_CMD_TCC: "./chemical lang/tests/build.lab -arg-minimal -bm -v --assertions --mode debug_complete"
      ASSET_REGULAR: "linux-${{ matrix.asset_suffix }}.zip"
      ASSET_TCC: "linux-${{ matrix.asset_suffix }}-tcc.zip"
    steps:
      - name: Checkout repository (tests)
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
            echo "Using user-specified release tag: $TAG"
          else
            echo "Resolving latest release tag..."
            releases=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
            TAG=$(echo "$releases" | jq -r '[.[] | select(.assets | map(.name) | index("'"${ASSET_REGULAR}"'"))] | .[0].tag_name')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "Error: no release found with asset ${ASSET_REGULAR}."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TARGET_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using release tag: $TAG"

      - name: Clean repository, Keep only lang/tests
        run: |
          echo "Cleaning repository: Removing all directories except 'lang'"
          find . -maxdepth 1 -mindepth 1 -type d ! -name "lang" -exec rm -rf {} +
          echo "Inside lang, removing all directories except 'tests'"
          cd lang
          find . -maxdepth 1 -mindepth 1 -type d ! -name "tests" -exec rm -rf {} +
          cd ..
        shell: bash

      - name: Create output directory
        run: mkdir -p output

      - name: Checkout release test sources
        if: ${{ !inputs.use_latest_tests }}
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}
          path: release-tests
          fetch-depth: 1

      - name: Process Linux Regular Variant
        run: |
          echo "== Processing Linux Regular Variant =="
          echo "Fetching release information..."
          releases=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
          ASSET_URL=$(echo "$releases" | jq -r '.[] | select(.tag_name == "'"$TARGET_TAG"'") | .assets[] | select(.name=="'"${ASSET_REGULAR}"'") | .browser_download_url')
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Error: Asset ${ASSET_REGULAR} not found."
            exit 1
          fi
          echo "Downloading asset from $ASSET_URL"
          curl -L -o asset.zip "$ASSET_URL"
          unzip -o -q asset.zip || true
          # Determine the release root (fixed name inside archive)
          release_root="chemical"
          if [ ! -d "$release_root" ]; then
            echo "Error: expected directory '$release_root' not found."
            exit 1
          fi
          echo "Using release root: $release_root"
          # If the asset does not already include the tests module, copy it from the repository.
          if [ ! -d "$release_root/lang/tests" ]; then
            mkdir -p "$release_root/lang"
            if [ -d "$GITHUB_WORKSPACE/release-tests/lang/tests" ]; then
              cp -r "$GITHUB_WORKSPACE/release-tests/lang/tests" "$release_root/lang"
            else
              cp -r "$GITHUB_WORKSPACE/lang/tests" "$release_root/lang"
            fi
          fi
          pushd "$release_root"
          echo "Running compile command for Linux Regular Variant:"
          echo "${COMPILER_CMD_REGULAR}" | tee compile_output.txt
          eval ${COMPILER_CMD_REGULAR} | tee -a compile_output.txt
          popd
          cp "$release_root/compile_output.txt" "$GITHUB_WORKSPACE/output/linux-${{ matrix.arch }}-regular-output.txt"
        shell: bash

      - name: Process Linux TCC Variant
        run: |
          echo "== Processing Linux TCC Variant =="
          echo "Fetching release information..."
          releases=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
          ASSET_URL=$(echo "$releases" | jq -r '.[] | select(.tag_name == "'"$TARGET_TAG"'") | .assets[] | select(.name=="'"${ASSET_TCC}"'") | .browser_download_url')
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Error: Asset ${ASSET_TCC} not found."
            exit 1
          fi
          echo "Downloading asset from $ASSET_URL"
          curl -L -o asset.zip "$ASSET_URL"
          unzip -o -q asset.zip || true
          # Determine the release root (fixed name inside archive)
          release_root="chemical-tcc"
          if [ ! -d "$release_root" ]; then
            echo "Error: expected directory '$release_root' not found."
            exit 1
          fi
          echo "Using release root: $release_root"
          if [ ! -d "$release_root/lang/tests" ]; then
            mkdir -p "$release_root/lang"
            if [ -d "$GITHUB_WORKSPACE/release-tests/lang/tests" ]; then
              cp -r "$GITHUB_WORKSPACE/release-tests/lang/tests" "$release_root/lang"
            else
              cp -r "$GITHUB_WORKSPACE/lang/tests" "$release_root/lang"
            fi
          fi
          pushd "$release_root"
          rm -rf lang/tests/build
          echo "Running compile command for Linux TCC Variant:"
          echo "${COMPILER_CMD_TCC}" | tee compile_output.txt
          eval ${COMPILER_CMD_TCC} | tee -a compile_output.txt
          popd
          cp "$release_root/compile_output.txt" "$GITHUB_WORKSPACE/output/linux-${{ matrix.arch }}-tcc-output.txt"
        shell: bash

      - name: Upload Linux Outputs
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-tests-output
          path: output

