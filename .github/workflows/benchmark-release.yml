name: Benchmark Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to benchmark (e.g. v0.5.7). Leave empty to use the latest published release.'
        required: false
        type: string
        default: ''
      # NOTE: there is deliberately NO skip_llvm and NO quick option here.
      # Release benchmarks only download prebuilt binaries — they never build
      # the compiler — so both backends (TCCCompiler + LLVM Compiler) are
      # always benchmarked, and the full test suite always runs alongside the
      # hello benchmarks (hello takes seconds, the test suite ~20 s; splitting
      # them into separate workflow runs would download the compiler twice).
  release:
    types: [published]

permissions:
  contents: write

jobs:
  collect:
    name: Collect ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    # Release jobs download prebuilt binaries (no compiler build), so they are
    # fast; the cap is only a safety net for long test suites.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the build-and-release.yml platform matrix exactly, so every
        # binary a release ships gets benchmarked + test-suite'd on the platform
        # it was built for.
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            alpine: false
            workdir: .
            deps: sudo apt-get update && sudo apt-get install -y jq zip unzip
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            alpine: false
            workdir: .
            deps: sudo apt-get update && sudo apt-get install -y jq zip unzip
          - name: alpine-x64
            runner: ubuntu-24.04
            container: alpine:3.20
            platform: linux-alpine
            arch: x64
            alpine: true
            workdir: tagrepo
            deps: apk add --no-cache bash curl jq zip unzip git coreutils
          - name: alpine-arm64
            runner: ubuntu-24.04-arm
            container: alpine:3.20
            platform: linux-alpine
            arch: arm64
            alpine: true
            workdir: tagrepo
            deps: apk add --no-cache bash curl jq zip unzip git coreutils
          - name: macos-arm64
            runner: macos-26
            platform: macos
            arch: arm64
            alpine: false
            workdir: .
            deps: brew install jq || true
          - name: macos-x64
            runner: macos-15-intel
            platform: macos
            arch: x64
            alpine: false
            workdir: .
            deps: brew install jq || true
          - name: windows-x64
            runner: windows-2025
            platform: windows
            arch: x64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"
          - name: windows-arm64
            runner: windows-11-arm
            platform: windows
            arch: arm64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"
          - name: windows-mingw-x64
            runner: windows-2025
            platform: windows-mingw
            arch: x64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"
          - name: windows-mingw-arm64
            runner: windows-11-arm
            platform: windows-mingw
            arch: arm64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"
          - name: windows-mingw-msvcrt-x64
            runner: windows-2025
            platform: windows-mingw-msvcrt
            arch: x64
            alpine: false
            workdir: .
            deps: echo "jq/unzip preinstalled on windows runners"

    steps:
      - name: Install dependencies
        # No `shell:` key here: the alpine container has no bash until this
        # step installs it, so the runner falls back to the container's sh
        # (same pattern as compile-tests.yml's alpine job).
        run: ${{ matrix.deps }}

      - name: Checkout (default branch — scripts + full history)
        if: ${{ !matrix.alpine }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            # authenticate (unauthenticated calls are easily rate-limited and
            # return an error OBJECT, which breaks the .[].assets jq below),
            # and guard the query against non-array responses (rate limit,
            # transient 5xx). Both checks must hold before we use the result.
            TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/chemicallang/chemical/releases?per_page=100" \
              | jq -r 'if type == "array" then ([.[] | select(.assets | length > 0)] | .[0].tag_name) else empty end')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::could not resolve a release tag (specify release_tag input or check the GitHub API response)"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # Alpine containers have no node (musl), so JS actions like
      # actions/checkout cannot run there. Clone with plain git instead:
      #   - tagrepo : the release tag (for `git archive <tag> lang/tests`)
      #   - tooling : the DEFAULT branch (collection scripts live in scripts/,
      #               not in release tags — the tag does not contain them)
      # Both go into SUBDIRECTORIES so they don't clobber the workspace.
      - name: Checkout (alpine — plain git, no JS actions)
        if: ${{ matrix.alpine }}
        shell: bash
        run: |
          git clone --depth 1 --branch "$TAG" "https://github.com/${{ github.repository }}.git" tagrepo
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" tooling

      - name: Collect release benchmarks
        shell: bash
        working-directory: ${{ matrix.workdir }}
        run: |
          # alpine runs scripts from the tooling clone; everyone else from the checkout
          TOOL_DIR="$GITHUB_WORKSPACE/scripts"
          if [ "${{ matrix.alpine }}" = "true" ]; then
            TOOL_DIR="$GITHUB_WORKSPACE/tooling/scripts"
          fi
          ARGS="--tag ${TAG} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}"
          # alpine only: the collect runs in the tagrepo working-directory with
          # scripts from tooling/, which would default OUT to tooling/.bench-data
          # — never matching the upload path. Other platforms already default to
          # the workspace root (and on Windows GITHUB_WORKSPACE is a Windows-style
          # path, so do NOT use it in bash for them).
          if [ "${{ matrix.alpine }}" = "true" ]; then ARGS="$ARGS --out $GITHUB_WORKSPACE/.bench-data"; fi
          bash "$TOOL_DIR/bench-collect-release.sh" $ARGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-release-${{ matrix.name }}
          path: .bench-data/
          # `.bench-data` is a hidden directory (leading dot); upload-artifact
          # silently skips hidden paths unless explicitly included — without
          # this every platform uploads nothing
          include-hidden-files: true
          if-no-files-found: ignore

  publish:
    name: Publish to gh-pages
    needs: [collect]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (default branch — scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release data
        uses: actions/download-artifact@v4
        with:
          path: merged
          merge-multiple: true

      - name: Publish to gh-pages
        run: |
          mkdir -p .bench-data
          # collect uploads `path: .bench-data/` (include-hidden-files), so the
          # artifact root IS the contents of .bench-data/ (releases/ here)
          if [ -d merged/daily ]; then cp -r merged/daily .bench-data/; fi
          if [ -d merged/releases ]; then cp -r merged/releases .bench-data/; fi
          bash scripts/bench-push-pages.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
