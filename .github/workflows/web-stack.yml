name: Web stack

# The gates that keep lang/docs/web-stack-plan.md honest. Every one of them is a
# measurement with a pass criterion (§3.19), run against the TCCCompiler build:
#
#   js-backend-suites      the JS backend reproduces the native output of four
#                          fixtures byte for byte, and rejects what it cannot emit
#                          with a position
#   static-site-test       two pages share one hashed bundle, no inline <script>,
#                          in-memory build/serve with ETag + 304
#   web-app-test           `web::App`: one route table mixing pre-rendered and
#                          per-request routes on one bundle, per-route cache policy,
#                          redirects/404, mount path, sitemap, sessions + CSRF
#   web-dom-test           client/*.ch using the typed `dom` module compiles in the
#                          --web client job and runs against a host DOM under Node
#   web-golden-test        the Phase 0 fixtures' HTML/JS/CSS match their goldens
#                          (0 JS for a static page, u1..u5 hydration ids, route
#                          titles + noindex, the shell baseline)
#   web-split-test         `--web` builds shared+client as JS and shared+server as
#                          native, and a native symbol reached from shared fails
#                          the client pass with its source location
#   web-two-pass-test      a shared `#universal` component is compiled by both
#                          `--web` passes: the server renders it and the client
#                          body-checks + bundles it (H31)
#   web-index-test         `index_with` metadata, the IndexModule/JobBegin hooks,
#                          namespace flattening and duplicate providers
#   web-body-check-test    001/002/006/008 negatives, 005 positives, chains,
#                          built-ins and the client/server split
#   web-two-side-test      server skips when there is no provider, client runs,
#                          index isolation, native-only build
#   web-component-typing-test
#                          the 196-component corpus: typed rules strict, 005
#                          baseline stable, both `--web` sides checked
#   component-typing-audit no DOM/typing special-case in compiler/, enum sync,
#                          CBI bindings present, backends read MIR only
#   web-typing-perf        cold/warm build, plugin rebuild, canonical bundle
#                          size, index calls/RSS (budget checked only on the
#                          baseline machine)
#
# These run on pull requests because they are the only checks that notice a
# bundle regression: without them the numbers in the plan drift and nobody sees it.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: web-stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-stack:
    name: Web stack gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 time

      - name: Set up Node (the JS backend fixtures run their bundles)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up TinyCC
        run: ./scripts/setup.sh

      - name: Configure TCCCompiler
        run: ./scripts/configure.sh --no-llvm --generator Ninja

      - name: Build TCCCompiler
        run: ./scripts/build.sh --tcc -j "$(nproc)"

      - name: JS backend differential suites
        run: ./scripts/js-backend-suites.sh

      - name: Static site (shared bundle, no inline scripts, ETag/304)
        run: ./scripts/static-site-test.sh

      - name: Starter template builds and produces its documented output
        run: ./scripts/web-starter-test.sh

      - name: App route table (mixed delivery, one bundle, sessions + CSRF)
        run: ./scripts/web-app-test.sh

      - name: Typed `dom` in a client module (compiled to JS, run against a DOM)
        run: node --version && ./scripts/web-dom-test.sh

      - name: Phase 0 probe gates (static output: no inline JS, no duplicated defs, hashed assets)
        run: ./scripts/web-probe.sh analyze lang/compiled/static_site_out --strict

      - name: Phase 0 fixture goldens
        run: ./scripts/web-golden-test.sh

      - name: Two-job web build (`--web`)
        run: ./scripts/web-split-test.sh

      - name: Shared `#universal` component in both `--web` passes
        run: ./scripts/web-two-pass-test.sh

      - name: `index_with` metadata and index hooks
        run: ./scripts/web-index-test.sh

      - name: Component body checks (001/002/006/008, counted 005)
        run: ./scripts/web-body-check-test.sh

      - name: Server/client two-side body check and index isolation
        run: ./scripts/web-two-side-test.sh

      - name: Component corpus: typed rules strict, 005 baseline
        run: ./scripts/web-component-typing-test.sh

      - name: Component typing boundary audit
        run: ./scripts/component-typing-audit.sh

      # The baseline is host-specific, so CI measures but skips the budget on a
      # different machine. Run `--update-baseline` on the benchmark host.
      - name: Component typing performance (cold/warm, plugin, bundle)
        run: ./scripts/web-typing-perf.sh

      - name: Declarations-only host modules (`host = "js"`) on a native job
        run: ./scripts/web-types-only-test.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-stack-logs
          path: |
            /tmp/web_golden_*.log
            /tmp/web_golden_*.diff
            /tmp/web_golden_probe_*.txt
            lang/compiled/web-split-gate/*.log
            lang/compiled/web-two-pass-gate/*.log
            lang/compiled/web-types-only-gate/*.log
            lang/compiled/web-body-check-gate/*.log
            lang/compiled/web-two-side-gate/*.log
            lang/compiled/web-component-typing-gate/*.log
            lang/compiled/web-typing-perf/*.log
          if-no-files-found: ignore
