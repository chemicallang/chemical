name: Deploy API Reference

# Manual dispatch only — generates the API reference site with the released
# `refgen` transformer and deploys it to Cloudflare Workers
# (https://api.chemicallang.com).
#
# The target module (libs/refgen/refgen.mod) ships inside the release package
# alongside the compiler, so no compiler build is required. The Cloudflare
# Worker config (`wrangler.toml`) is generated on the fly by the workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # TCC release package: contains the compiler, the `libs/` (std, refgen,
  # docgen, page, ...) the transformer resolves relative to the executable,
  # and the refgen documentation target module.
  RELEASE_ASSET: linux-x64-tcc.zip
  RELEASE_ROOT: chemical-tcc

jobs:
  deploy-docs:
    name: Generate and deploy reference docs
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:

      - name: Write wrangler.toml
        run: |
          cat > wrangler.toml <<'EOF'
          name = "reference-docs"
          compatibility_date = "2024-01-01"

          [assets]
          directory = "docs"
          EOF

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Download compiler from latest release
        shell: bash
        run: |
          releases=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")

          # newest release that actually ships the TCC package
          TAG=$(echo "$releases" | jq -r \
            '[.[] | select(.assets | map(.name) | index("'"$RELEASE_ASSET"'"))] | .[0].tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No release found containing asset '$RELEASE_ASSET'"
            exit 1
          fi
          echo "Using release: $TAG"

          ASSET_URL=$(echo "$releases" | jq -r \
            '.[] | select(.tag_name == "'"$TAG"'") | .assets[] | select(.name == "'"$RELEASE_ASSET"'") | .browser_download_url')
          curl -L -o release.zip "$ASSET_URL"
          unzip -o -q release.zip

          if [ ! -f "$RELEASE_ROOT/chemical" ]; then
            echo "::error::Expected compiler at '$RELEASE_ROOT/chemical'"
            exit 1
          fi
          chmod +x "$RELEASE_ROOT/chemical"

      - name: Generate documentation (refgen)
        run: ./$RELEASE_ROOT/chemical run refgen $RELEASE_ROOT/libs/refgen/refgen.mod

      - name: Show generated docs
        run: |
          echo "Generated $(find docs -type f | wc -l) files in docs/"
          du -sh docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
