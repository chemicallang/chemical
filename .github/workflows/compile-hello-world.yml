name: Test Hello World On Latest Release

# Compiles a "hello world" program with the compilers shipped in a chosen
# release and runs the resulting binary, on EVERY platform/arch the Build and
# Release workflow produces (regular LLVM compiler + TCC compiler variants).
#
# MANUAL ONLY — never runs automatically. Pick the release version to test via
# the `release_tag` input (leave empty to use the latest release).
#
# The job VERIFIES the binary: it runs the compiled executable and asserts its
# output is exactly "hello world". A match prints a PASS line (per platform),
# a mismatch fails that specific matrix job — no artifacts are uploaded. This
# shows which platforms successfully produce a working binary for the release.
#
# The `import_std` manual input switches the test from a self-contained
# main.ch (printf declared via @extern) to a chemical.mod that imports std —
# the hello world then calls printf WITHOUT declaring it, forcing the compiler
# to compile the std library first (a stronger test of the release package).
#
# The `use_debug_builds` input switches to the DEBUG builds (full debug
# symbols) published to chemicallang/chemical-debug by the Build and Release
# workflow with a debug config. The compiler is then run under a debugger
# (gdb on linux/alpine/windows, lldb on macOS) so a crash yields a full
# backtrace; on failure a crash-dump zip (backtrace, logs, commit metadata,
# system info) is uploaded as an artifact in THIS repo. Debug asset names are
# the release names with a -debug suffix (linux-x64.zip -> linux-x64-debug.zip).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version to test (e.g. v0.5.7). Leave empty to test the latest release.'
        required: false
        type: string
        default: ''
      # choice (not boolean) — GitHub Actions has a known bug where boolean
      # workflow_dispatch inputs can be submitted as false even when checked
      import_std:
        description: 'Import std: write a chemical.mod with "import std" and call printf without declaring it (forces the compiler to compile the std library first)'
        required: false
        type: choice
        # quoted to avoid YAML 1.1 boolean coercion (bare no/yes can parse as
        # false/true in stricter parsers — the same class of bug as the
        # boolean input we're replacing)
        default: 'no'
        options:
          - 'no'
          - 'yes'
      # release (default): test the stable releases published to
      # chemicallang/chemical. debug: test the DEBUG builds (full debug
      # symbols) published to chemicallang/chemical-debug instead, running the
      # compiler under gdb/lldb so a crash produces a full backtrace that is
      # uploaded as a crash-dump artifact in THIS repo on failure. Note the
      # debug release must be PUBLISHED (publish_release checked in the Build
      # and Release workflow) for its assets to be resolvable here.
      use_debug_builds:
        description: 'Build mode. release (default) = stable chemicallang/chemical releases. debug = DEBUG builds from chemicallang/chemical-debug, compiler run under gdb/lldb, crash dumps uploaded as artifacts on failure.'
        required: false
        type: choice
        default: release
        options:
          - release
          - debug

jobs:
  test-release:
    name: Hello world — ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    # alpine entries run inside an alpine container (musl) so the alpine
    # release binaries execute natively; all other entries run on the host
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ––– linux (glibc) –––
          - runner: ubuntu-24.04
            asset: linux-x64.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: sudo apt-get update && sudo apt-get install -y jq zip unzip
          - runner: ubuntu-24.04
            asset: linux-x64-tcc.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: sudo apt-get update && sudo apt-get install -y jq zip unzip
          - runner: ubuntu-24.04-arm
            asset: linux-arm64.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: sudo apt-get update && sudo apt-get install -y jq zip unzip
          - runner: ubuntu-24.04-arm
            asset: linux-arm64-tcc.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: sudo apt-get update && sudo apt-get install -y jq zip unzip

          # ––– linux alpine (musl) –––
          - runner: ubuntu-24.04
            container: alpine:3.20
            asset: linux-alpine-x64.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: apk add --no-cache bash curl jq zip unzip build-base
          - runner: ubuntu-24.04
            container: alpine:3.20
            asset: linux-alpine-x64-tcc.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: apk add --no-cache bash curl jq zip unzip build-base
          - runner: ubuntu-24.04-arm
            container: alpine:3.20
            asset: linux-alpine-arm64.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: apk add --no-cache bash curl jq zip unzip build-base
          - runner: ubuntu-24.04-arm
            container: alpine:3.20
            asset: linux-alpine-arm64-tcc.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: apk add --no-cache bash curl jq zip unzip build-base

          # ––– macos –––
          - runner: macos-15-intel
            asset: macos-x64.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: brew install jq || true
          - runner: macos-15-intel
            asset: macos-x64-tcc.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: brew install jq || true
          - runner: macos-26
            asset: macos-arm64.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: brew install jq || true
          - runner: macos-26
            asset: macos-arm64-tcc.zip
            chemical_executable: chemical
            binary_name: helloworld
            deps: brew install jq || true

          # ––– windows (msvc) –––
          - runner: windows-2025
            asset: windows-x64.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"
          - runner: windows-2025
            asset: windows-x64-tcc.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"
          - runner: windows-11-arm
            asset: windows-arm64.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"
          - runner: windows-11-arm
            asset: windows-arm64-tcc.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"

          # ––– windows (mingw ucrt) –––
          - runner: windows-2025
            asset: windows-mingw-x64.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"
          - runner: windows-2025
            asset: windows-mingw-x64-tcc.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"
          - runner: windows-11-arm
            asset: windows-mingw-arm64.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"
          - runner: windows-11-arm
            asset: windows-mingw-arm64-tcc.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"

          # ––– windows (mingw msvcrt) –––
          - runner: windows-2025
            asset: windows-mingw-msvcrt-x64.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"
          - runner: windows-2025
            asset: windows-mingw-msvcrt-x64-tcc.zip
            chemical_executable: chemical.exe
            binary_name: main.exe
            deps: echo "jq/unzip preinstalled on windows runners"

    steps:
      - name: Install dependencies
        # No `shell:` key: on the alpine container the runner falls back to sh
        # (bash doesn't exist yet). bash is installed here before later bash
        # steps run — same pattern as the other alpine jobs in this repo.
        run: ${{ matrix.deps }}

      # Debug mode runs the compiler under a debugger (gdb on linux/alpine/
      # windows, lldb on macOS). lldb ships with macOS runners; gdb must be
      # installed. Only runs in debug mode — release mode is untouched.
      - name: Install debugger (debug mode only)
        if: ${{ inputs.use_debug_builds == 'debug' }}
        run: |
          case "${{ runner.os }}" in
            macOS)
              echo "lldb is preinstalled on macOS runners — nothing to install"
              ;;
            Windows)
              choco install gdb -y --no-progress || true
              ;;
            Linux)
              # alpine container has no apt — install via apk; host linux uses
              # apt. `command -v apk` distinguishes the two at runtime.
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache gdb
              else
                sudo apt-get update && sudo apt-get install -y gdb
              fi
              ;;
          esac
        shell: bash

      - name: Create source files (non-Windows)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ inputs.import_std }}" = "yes" ]; then
            # import std: printf comes from the std library (not declared here),
            # so compiling forces the compiler to build std first
            mkdir -p src
            printf 'application helloworld\nsource "src"\nimport std\n' > chemical.mod
            printf 'public func main() : int {\n    printf("hello world")\n    return 0\n}\n' > src/main.ch
            echo "ENTRY_FILE=chemical.mod" >> "$GITHUB_ENV"
          else
            echo "@extern" > main.ch
            echo "public func printf(format : *char, _ : any...)" >> main.ch
            echo "public func main() : int {" >> main.ch
            echo "    printf(\"hello world\")" >> main.ch
            echo "    return 0;" >> main.ch
            echo "}" >> main.ch
            echo "ENTRY_FILE=main.ch" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Create source files (Windows)
        if: runner.os == 'Windows'
        run: |
          if ("${{ inputs.import_std }}" -eq "yes") {
            New-Item -ItemType Directory -Path src -Force | Out-Null
            Set-Content -Path chemical.mod -Value @(
              'application helloworld',
              'source "src"',
              'import std'
            )
            Set-Content -Path src\main.ch -Value @(
              'public func main() : int {',
              '    printf("hello world")',
              '    return 0',
              '}'
            )
            Add-Content -Path $env:GITHUB_ENV -Value 'ENTRY_FILE=chemical.mod'
          } elseif ("${{ matrix.asset }}" -notlike "*-tcc*") {
            # Bare hello world on a windows non-tcc build (msvc/mingw). The
            # UCRT header provides printf as an inline wrapper, so
            # libucrt.lib has no out-of-line printf symbol (windows-arm64
            # fails to resolve it). Link the CRT's legacy out-of-line stdio
            # definitions through a chemical.mod `link` statement — the same
            # mechanism cstd's chemical.mod uses for `import std` builds.
            # (The `-l` CLI flag can't be used here: the CLI adds its value
            # to the linker's *object* list as a bare filename, so lld-link
            # reports "no such file or directory".)
            New-Item -ItemType Directory -Path src -Force | Out-Null
            Set-Content -Path chemical.mod -Value @(
              'application helloworld',
              'source "src"',
              'link "legacy_stdio_definitions" if windows && !tcc'
            )
            Set-Content -Path src\main.ch -Value @(
              '@extern',
              'public func printf(format : *char, _ : any...)',
              'public func main() : int {',
              '    printf("hello world")',
              '    return 0;',
              '}'
            )
            Add-Content -Path $env:GITHUB_ENV -Value 'ENTRY_FILE=chemical.mod'
          } else {
            # tcc builds resolve printf from msvcrt.dll — no extra link needed.
            Set-Content -Path main.ch -Value @(
              '@extern',
              'public func printf(format : *char, _ : any...)',
              'public func main() : int {',
              '    printf("hello world")',
              '    return 0;',
              '}'
            )
            Add-Content -Path $env:GITHUB_ENV -Value 'ENTRY_FILE=main.ch'
          }
        shell: pwsh

      - name: Download release asset (non-Windows)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # debug builds live in chemicallang/chemical-debug and their asset
          # names carry a -debug suffix (linux-x64.zip -> linux-x64-debug.zip);
          # release builds come from this repo with the plain asset name.
          if [ "${{ inputs.use_debug_builds }}" = "debug" ]; then
            REPO="chemicallang/chemical-debug"
            ASSET="${{ matrix.asset }}"
            ASSET="${ASSET%.zip}-debug.zip"
            echo "DEBUG mode: downloading $ASSET from $REPO"
          else
            REPO="${GITHUB_REPOSITORY}"
            ASSET="${{ matrix.asset }}"
          fi
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
            echo "Using specified release tag: $TAG"
            ASSET_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
              | jq -r --arg a "$ASSET" '.assets[] | select(.name==$a) | .browser_download_url')
          else
            echo "Fetching release information (including pre-releases)..."
            releases=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${REPO}/releases")
            # the release that carries this asset (first match, newest first) —
            # its tag names the commit.json metadata file below
            ASSET_RELEASE=$(echo "$releases" | jq -r --arg a "$ASSET" '[.[] | select(.assets | map(.name) | index($a))] | .[0]')
            ASSET_URL=$(echo "$ASSET_RELEASE" | jq -r --arg a "$ASSET" '.assets[] | select(.name==$a) | .browser_download_url')
            TAG=$(echo "$ASSET_RELEASE" | jq -r '.tag_name')
          fi
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            if [ "${{ inputs.use_debug_builds }}" = "debug" ]; then
              echo "::warning::No debug build published for $ASSET in $REPO yet — skipping this platform (see the Build and Release workflow's deploy-debug job)."
              echo "::notice::SKIPPED ${{ matrix.asset }} in debug mode — no matching -debug.zip in chemical-debug"
              echo "SKIPPED=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Error: Asset $ASSET not found in $REPO."
            exit 1
          fi
          echo "Downloading asset from $ASSET_URL"
          curl -L -o asset.zip "$ASSET_URL"
          # debug releases ship commit.json — the source commit the binaries
          # were built from (bundled into crash dumps on failure)
          if [ "${{ inputs.use_debug_builds }}" = "debug" ]; then
            curl -sL -o commit.json "https://github.com/chemicallang/chemical-debug/releases/download/${TAG}/commit.json" || true
            if [ -s commit.json ]; then echo "commit metadata: $(head -c 120 commit.json)"; fi
          fi
        shell: bash

      - name: Download release asset (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ inputs.use_debug_builds }}" -eq "debug") {
            $repo = "chemicallang/chemical-debug"
            $assetName = "${{ matrix.asset }}"
            $assetName = $assetName.Substring(0, $assetName.Length - 4) + "-debug.zip"
            Write-Host "DEBUG mode: downloading $assetName from $repo"
          } else {
            $repo = $env:GITHUB_REPOSITORY
            $assetName = "${{ matrix.asset }}"
          }
          if ("${{ inputs.release_tag }}" -ne "") {
            Write-Host "Using specified release tag: ${{ inputs.release_tag }}"
            # Invoke-RestMethod throws on a 404 (nonexistent tag) — catch it so
            # a bad release_tag fails with a friendly message instead of a raw
            # HTTP exception (matches the bash path's graceful handling).
            try {
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/${{ inputs.release_tag }}" -Headers @{ Authorization = "token $env:GITHUB_TOKEN" }
            } catch {
              $release = $null
            }
            $tagName = "${{ inputs.release_tag }}"
          } else {
            Write-Host "Fetching release information (including pre-releases)..."
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Headers @{ Authorization = "token $env:GITHUB_TOKEN" }
            $release = $releases | Where-Object { $_.assets -and ($_.assets | Where-Object { $_.name -eq $assetName }) } | Select-Object -First 1
            $tagName = if ($release) { $release.tag_name } else { "" }
          }
          if (-not $release) {
            if ("${{ inputs.use_debug_builds }}" -eq "debug") {
              Write-Warning "No debug build published for $assetName in $repo yet — skipping this platform (see the Build and Release workflow's deploy-debug job)."
              Add-Content -Path $env:GITHUB_ENV -Value 'SKIPPED=1'
              exit 0
            }
            Write-Error "Error: release not found for asset $assetName."
            exit 1
          }
          $asset = $release.assets | Where-Object { $_.name -eq $assetName }
          if (-not $asset) {
            Write-Error "Error: Asset $assetName not found in the selected release."
            exit 1
          }
          Write-Host "Downloading asset from $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile asset.zip
          if ("${{ inputs.use_debug_builds }}" -eq "debug" -and $tagName) {
            try {
              Invoke-WebRequest -Uri "https://github.com/chemicallang/chemical-debug/releases/download/$tagName/commit.json" -OutFile commit.json
              Write-Host "commit metadata downloaded"
            } catch { }
          }
        shell: pwsh

      - name: Extract asset (non-Windows)
        if: runner.os != 'Windows' && env.SKIPPED != '1'
        run: |
          unzip -o -q asset.zip || true
        shell: bash

      - name: Extract asset (Windows)
        if: runner.os == 'Windows' && env.SKIPPED != '1'
        run: |
          Expand-Archive -Path asset.zip -DestinationPath . -Force
        shell: pwsh

      - name: Compile source code (non-Windows)
        if: runner.os != 'Windows' && env.SKIPPED != '1'
        # In debug mode a compiler crash does NOT fail this step (exit code is
        # captured, CRASHED=1 is set, and the crash-dump steps below handle
        # it). Genuine setup failures (missing release root, missing entry
        # file) still fail the job immediately.
        run: |
          # release/debug zips extract to a top-level dir: chemical (regular)
          # or chemical-tcc (tcc variant) — derive it from the asset name
          if [[ "${{ matrix.asset }}" == *-tcc.zip || "${{ matrix.asset }}" == *-tcc-debug.zip ]]; then
            release_root="chemical-tcc"
          else
            release_root="chemical"
          fi
          if [ ! -d "$release_root" ]; then
            echo "Error: expected release root '$release_root' not found after extraction."
            ls -la
            exit 1
          fi
          echo "Using release root: $release_root"
          cp "$ENTRY_FILE" "$release_root/"
          if [ "$ENTRY_FILE" = "chemical.mod" ]; then
            cp -r src "$release_root/"
          fi
          # crash dumps land at the workspace root (outside release_root)
          mkdir -p "$GITHUB_WORKSPACE/crash-dump"
          pushd "$release_root"
          if [ "${{ inputs.use_debug_builds }}" = "debug" ]; then
            # DEBUG MODE — run the compiler directly first; on a crash/failure
            # re-run the EXACT command under the debugger to capture a full
            # backtrace (all threads, registers, disassembly at $pc) — the
            # point of shipping debug symbols. set +e: the default bash shell
            # runs with -e, which would abort before we can read $?.
            # tee: print the compiler output to the log AND capture it for the
            # crash-dump artifact — no download needed to see what happened.
            # After a pipe, $? is tee's exit — read the compiler's via
            # ${PIPESTATUS[0]}.
            set +e
            ./${{ matrix.chemical_executable }} "$ENTRY_FILE" -o ${{ matrix.binary_name }} -v 2>&1 | tee compile_output.txt
            RC=${PIPESTATUS[0]}
            set -e
            echo "compiler exit code: $RC"
            if [ $RC -ne 0 ]; then
              echo "== compiler failed (exit $RC) — capturing diagnostics under debugger =="
              cp compile_output.txt "$GITHUB_WORKSPACE/crash-dump/compile_output.txt"
              # timeout guard: a hung debugger must not stall the job for
              # hours. macOS lacks coreutils `timeout` — run without it there.
              TIMEOUT=""
              if command -v timeout >/dev/null 2>&1; then
                TIMEOUT="timeout 300"
              fi
              if [ "$(uname -s)" = "Darwin" ]; then
                $TIMEOUT lldb -b \
                  -o "run" \
                  -o "thread list" \
                  -o "thread backtrace all" \
                  -o "register read" \
                  -o "disassemble --frame" \
                  -- ./${{ matrix.chemical_executable }} "$ENTRY_FILE" -o ${{ matrix.binary_name }} -v > "$GITHUB_WORKSPACE/crash-dump/debugger.txt" 2>&1 || true
              else
                $TIMEOUT gdb -batch \
                  -ex "set pagination off" \
                  -ex "run" \
                  -ex "echo \n=== INFO THREADS ===\n" \
                  -ex "info threads" \
                  -ex "echo \n=== THREAD APPLY ALL BT FULL ===\n" \
                  -ex "thread apply all bt full" \
                  -ex "echo \n=== INFO REGISTERS ===\n" \
                  -ex "info registers" \
                  -ex "echo \n=== DISASSEMBLY AT PC ===\n" \
                  -ex "x/32i \$pc" \
                  -ex "echo \n=== BT FULL ===\n" \
                  -ex "bt full" \
                  --args ./${{ matrix.chemical_executable }} "$ENTRY_FILE" -o ${{ matrix.binary_name }} -v > "$GITHUB_WORKSPACE/crash-dump/debugger.txt" 2>&1 || true
              fi
              echo "CRASHED=1" >> "$GITHUB_ENV"
              echo "COMPILER_RC=$RC" >> "$GITHUB_ENV"
            else
              echo "== debug compiler completed successfully =="
            fi
            popd
          else
            # RELEASE MODE — run compiler command and capture its output.
            ./${{ matrix.chemical_executable }} "$ENTRY_FILE" -o ${{ matrix.binary_name }} -v | tee compile_output.txt
            popd
          fi
        shell: bash

      - name: Compile source code (Windows)
        if: runner.os == 'Windows' && env.SKIPPED != '1'
        # In debug mode a compiler crash does NOT fail this step (exit code is
        # captured, CRASHED=1 is set, and the crash-dump steps below handle
        # it). Genuine setup failures (missing release root, missing entry
        # file) still fail the job immediately.
        run: |
          if ("${{ matrix.asset }}" -like "*-tcc.zip" -or "${{ matrix.asset }}" -like "*-tcc-debug.zip") {
            $releaseRoot = ".\chemical-tcc"
          } else {
            $releaseRoot = ".\chemical"
          }
          if (-not (Test-Path -Path $releaseRoot)) {
            Write-Error "Error: expected release root '$releaseRoot' not found after extraction."
            Get-ChildItem
            exit 1
          }
          Write-Host "Using release root: $releaseRoot"
          Copy-Item -Path $env:ENTRY_FILE -Destination $releaseRoot
          if ($env:ENTRY_FILE -eq "chemical.mod") {
            Copy-Item -Path src -Destination $releaseRoot -Recurse
          }
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\crash-dump" -Force | Out-Null
          Push-Location $releaseRoot
          # The bare hello world (no `import std`) declares printf via @extern
          # and links no libraries. On windows-msvc the UCRT header provides
          # printf as an inline wrapper, so libucrt.lib has no out-of-line
          # printf symbol (windows-arm64 fails to resolve it). The generated
          # chemical.mod (see "Create source files (Windows)") carries a
          # `link "legacy_stdio_definitions"` statement — the same library
          # cstd's chemical.mod links for `import std` builds — which the
          # compiler passes to the linker as /DEFAULTLIB:legacy_stdio_definitions
          # (a -l CLI flag would be misread as an object file path). tcc
          # builds resolve printf from msvcrt.dll and use a bare main.ch.
          if ("${{ inputs.use_debug_builds }}" -eq "debug") {
            # DEBUG MODE — run the compiler directly first; on failure re-run
            # under gdb (choco-installed above) for a full backtrace.
            # Tee-Object: print the compiler output to the log AND capture it
            # for the crash-dump artifact — no download needed to see what
            # happened. $LASTEXITCODE still reflects the native command's
            # exit code in pwsh, even through the pipeline.
            .\${{ matrix.chemical_executable }} $env:ENTRY_FILE -o ${{ matrix.binary_name }} -v 2>&1 | Tee-Object -FilePath compile_output.txt
            $rc = $LASTEXITCODE
            Write-Host "compiler exit code: $rc"
            if ($rc -ne 0) {
              Write-Host "== compiler failed (exit $rc) — capturing backtrace under gdb =="
              Copy-Item -Path compile_output.txt -Destination "$env:GITHUB_WORKSPACE\crash-dump\compile_output.txt"
              $gdb = Get-Command gdb -ErrorAction SilentlyContinue
              if ($gdb) {
                try {
                  # timeout guard: a hung gdb must not stall the job
                  $tmo = Get-Command timeout -ErrorAction SilentlyContinue
                  if ($tmo) {
                    & timeout 300 gdb -batch -ex "set pagination off" -ex "run" -ex "info threads" -ex "thread apply all bt full" -ex "info registers" -ex "bt full" --args .\${{ matrix.chemical_executable }} $env:ENTRY_FILE -o ${{ matrix.binary_name }} -v > "$env:GITHUB_WORKSPACE\crash-dump\debugger.txt" 2>&1
                  } else {
                    & gdb -batch -ex "set pagination off" -ex "run" -ex "info threads" -ex "thread apply all bt full" -ex "info registers" -ex "bt full" --args .\${{ matrix.chemical_executable }} $env:ENTRY_FILE -o ${{ matrix.binary_name }} -v > "$env:GITHUB_WORKSPACE\crash-dump\debugger.txt" 2>&1
                  }
                } catch {
                  Write-Warning "gdb run failed: $_"
                  Set-Content -Path "$env:GITHUB_WORKSPACE\crash-dump\debugger.txt" -Value "gdb run failed: $_"
                }
              } else {
                Write-Warning "gdb not available — skipping backtrace capture (install failed?)"
                Set-Content -Path "$env:GITHUB_WORKSPACE\crash-dump\debugger.txt" -Value "gdb not available on this runner"
              }
              "CRASHED=1" | Out-File -FilePath $env:GITHUB_ENV -Append
              "COMPILER_RC=$rc" | Out-File -FilePath $env:GITHUB_ENV -Append
            } else {
              Write-Host "== debug compiler completed successfully =="
            }
          } else {
            # RELEASE MODE — Run compiler command and capture its output. pwsh
            # does NOT propagate a native command's exit code through a
            # pipeline, so check it explicitly — a failed compile must fail
            # the job.
            .\${{ matrix.chemical_executable }} $env:ENTRY_FILE -o ${{ matrix.binary_name }} -v | Tee-Object -FilePath compile_output.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Pop-Location
        shell: pwsh

      # ––– Debug mode crash dump –––
      # When the debug compiler crashed, bundle the backtrace + logs + commit
      # metadata + system info into a zip and upload it as an artifact in THIS
      # repo (chemical). Nothing is ever written back to chemical-debug. The
      # job then fails with a pointer to the artifact. On success nothing is
      # uploaded and the run proceeds to verify the binary below.
      - name: Package crash dump (debug mode)
        if: ${{ inputs.use_debug_builds == 'debug' && env.CRASHED == '1' }}
        shell: bash
        run: |
          {
            echo "=== SYSTEM INFO ==="
            uname -a 2>/dev/null || true
            [ -f /etc/os-release ] && cat /etc/os-release
            echo "platform: ${{ matrix.asset }}"
            echo "debug mode: yes"
            echo "compiler exit code: ${COMPILER_RC}"
            echo "compiler command: ${{ matrix.chemical_executable }} $ENTRY_FILE -o ${{ matrix.binary_name }} -v"
            echo "debugger: $(command -v gdb || command -v lldb || echo none)"
          } > crash-dump/system-info.txt
          cp commit.json crash-dump/ 2>/dev/null || true
          cp compile_output.txt crash-dump/ 2>/dev/null || true
          if command -v zip >/dev/null 2>&1; then
            zip -r -q crash-dump.zip crash-dump || tar -czf crash-dump.zip crash-dump || true
          else
            tar -czf crash-dump.zip crash-dump || true
          fi
          ls -la crash-dump.zip

      - name: Upload crash dump (debug mode)
        if: ${{ inputs.use_debug_builds == 'debug' && env.CRASHED == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-crash-${{ matrix.asset }}
          path: crash-dump.zip
          if-no-files-found: error

      - name: Mark job failed (debug compiler crashed)
        if: ${{ inputs.use_debug_builds == 'debug' && env.CRASHED == '1' }}
        shell: bash
        run: |
          # distinguish a real crash (signal in the debugger output) from a
          # plain nonzero exit (compile error) so the report is honest
          KIND="failed"
          if grep -qi "signal\|SIGSEGV\|SIGABRT\|Segmentation\|Abort" crash-dump/debugger.txt 2>/dev/null; then
            KIND="crashed"
          fi
          echo "::error::debug compiler ${KIND} on ${{ matrix.asset }} (exit ${COMPILER_RC}) — see the debug-crash-${{ matrix.asset }} artifact for the backtrace"
          exit 1

      - name: Run executable and verify hello world output (non-Windows)
        if: ${{ runner.os != 'Windows' && env.CRASHED != '1' && env.SKIPPED != '1' }}
        run: |
          if [[ "${{ matrix.asset }}" == *-tcc.zip || "${{ matrix.asset }}" == *-tcc-debug.zip ]]; then
            release_root="chemical-tcc"
          else
            release_root="chemical"
          fi
          echo "Using release root: $release_root"
          pushd "$release_root"
          # Run the compiled binary and capture its output + exit code. The
          # hello world program prints "hello world" with no trailing newline.
          # set +e: the default bash shell runs with -e, which would abort
          # before we can read $? for a crashing binary.
          set +e
          OUTPUT=$(./${{ matrix.binary_name }} 2>&1)
          RC=$?
          set -e
          popd
          echo "Executable output: '${OUTPUT}' (exit code ${RC})"
          if [ "$OUTPUT" = "hello world" ]; then
            echo "PASS: ${{ matrix.asset }} — executable output matches expected 'hello world'"
          else
            echo "FAIL: ${{ matrix.asset }} — expected 'hello world' but got '${OUTPUT}' (exit code ${RC})"
            exit 1
          fi
        shell: bash

      - name: Run executable and verify hello world output (Windows)
        if: ${{ runner.os == 'Windows' && env.CRASHED != '1' && env.SKIPPED != '1' }}
        run: |
          if ("${{ matrix.asset }}" -like "*-tcc.zip" -or "${{ matrix.asset }}" -like "*-tcc-debug.zip") {
            $releaseRoot = ".\chemical-tcc"
          } else {
            $releaseRoot = ".\chemical"
          }
          Write-Host "Using release root: $releaseRoot"
          Push-Location $releaseRoot
          # Run the compiled binary and capture its output + exit code. The
          # hello world program prints "hello world" with no trailing newline.
          $output = (& .\${{ matrix.binary_name }} 2>&1 | Out-String).Trim()
          $rc = $LASTEXITCODE
          Pop-Location
          Write-Host "Executable output: '$output' (exit code $rc)"
          if ($output -eq "hello world") {
            Write-Host "PASS: ${{ matrix.asset }} — executable output matches expected 'hello world'"
          } else {
            Write-Host "FAIL: ${{ matrix.asset }} — expected 'hello world' but got '$output' (exit code $rc)"
            exit 1
          }
        shell: pwsh
