name: Benchmark Daily

on:
  schedule:
    # once per day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to benchmark (default: HEAD of the default branch)'
        required: false
        type: string
        default: ''
      skip_llvm:
        description: 'Skip the LLVM backend — build + benchmark + test TCCCompiler and Interpreter only (LLVM build is the heavy part)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: benchmark-daily
  cancel-in-progress: false

jobs:
  benchmark:
    name: Daily benchmark
    runs-on: ubuntu-24.04
    # Standard runners cap a job at 6h; a TCCCompiler build is ~15 min and the
    # LLVM Compiler ~20 min, so a single daily point stays well inside this.
    timeout-minutes: 360
    steps:
      - name: Checkout (default branch — scripts + full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake jq zip unzip

      - name: Setup (download libtcc + prebuilt LLVM, submodules)
        # llvm.sh auto-resolves the latest llvm-prebuilt release tag (matching
        # CMakeLists' find_package(llvm ${LLVM_VERSION})); no version is
        # hardcoded here, so setup stays in sync with the repo's LLVM requirement.
        run: ./scripts/setup.sh --with-llvm

      - name: Configure cmake (TCC + LLVM Compiler targets)
        run: |
          timeout 600 cmake -S . -B cmake-build-debug -DCMAKE_BUILD_TYPE=Debug -DBUILD_COMPILER=ON -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON || true
          # If the LLVM configure failed, bench-collect-daily.sh re-configures
          # with BUILD_COMPILER=OFF and still collects TCC + Interpreter data.

      - name: Collect daily benchmark
        run: |
          TARGET="${{ inputs.commit }}"
          if [ -z "$TARGET" ]; then TARGET="${{ github.sha }}"; fi
          ARGS="--commit $TARGET"
          # Building is the expensive part (15-20 min); the test suite takes ~20 s,
          # so we always run hello + module benchmarks + test suite after a build.
          # The only skip is the LLVM backend.
          if [ "${{ inputs.skip_llvm }}" = "true" ]; then ARGS="$ARGS --skip-llvm"; fi
          bash scripts/bench-collect-daily.sh $ARGS

      - name: Publish to gh-pages
        # Only ever writes data/ to the gh-pages branch — never to main.
        run: bash scripts/bench-push-pages.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
