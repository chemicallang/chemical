name: Build Compiler Tests

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test against (e.g. v0.9.0). Leave empty to use the latest release. For debug builds this is the debug release tag (commit SHA or chemical tag).'
        required: false
        type: string
        default: ''
      use_latest_tests:
        description: 'Use test sources from the latest commit instead of the selected release commit.'
        required: false
        type: boolean
        default: false
      use_debug_builds:
        description: 'Build mode. "release" (default) tests the stable releases published to chemicallang/chemical. "debug" tests the DEBUG builds (full debug symbols) published to chemicallang/chemical-debug instead: the compiler runs under gdb/lldb so a crash produces a full backtrace. If the test suite crashes/fails, a crash-dump zip with all collected data is uploaded as an artifact; on success no data is uploaded, only logs. Test sources are taken from the source commit recorded in the debug release.'
        required: false
        type: choice
        default: release
        options:
          - release
          - debug
      deadlock_timeout_minutes:
        description: 'Minutes before a running test suite is assumed to be DEADLOCKED (default 10; the suite never takes this long). On timeout, the process is attached with a debugger and full diagnostics are collected (all-thread backtraces, registers, /proc data) and uploaded.'
        required: false
        type: number
        default: 10

jobs:
  setup:
    name: "Mode (${{ inputs.use_debug_builds }})"
    runs-on: ubuntu-latest
    steps:
      - name: Print active mode
        run: |
          MODE=${{ inputs.use_debug_builds }}
          echo "=================================="
          echo "  Build Compiler Tests mode: $MODE"
          echo "=================================="
          if [ "$MODE" = "debug" ]; then
            echo "::notice::Running DEBUG build tests against chemicallang/chemical-debug. The release test jobs are skipped."
          else
            echo "::notice::Running RELEASE build tests against chemicallang/chemical. Set the 'use_debug_builds' input to 'debug' to test debug builds instead."
          fi

  # ─────────────────────────────────────────────────────────────────
  # Release build tests — one job per asset (platform × variant)
  # ─────────────────────────────────────────────────────────────────
  test-release:
    name: "Test — ${{ matrix.asset }}"
    if: ${{ inputs.use_debug_builds == 'release' }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ––– linux (glibc) –––
          - runner: ubuntu-24.04
            asset: linux-x64.zip
            release_root: chemical
            exe: ./chemical
            test_exe: chemical-tests
          - runner: ubuntu-24.04
            asset: linux-x64-tcc.zip
            release_root: chemical-tcc
            exe: ./chemical
            test_exe: chemical-tests
          - runner: ubuntu-24.04-arm
            asset: linux-arm64.zip
            release_root: chemical
            exe: ./chemical
            test_exe: chemical-tests
          - runner: ubuntu-24.04-arm
            asset: linux-arm64-tcc.zip
            release_root: chemical-tcc
            exe: ./chemical
            test_exe: chemical-tests

          # ––– linux alpine (musl) –––
          - runner: ubuntu-24.04
            container: alpine:3.20
            asset: linux-alpine-x64.zip
            release_root: chemical
            exe: ./chemical
            test_exe: chemical-tests
          - runner: ubuntu-24.04
            container: alpine:3.20
            asset: linux-alpine-x64-tcc.zip
            release_root: chemical-tcc
            exe: ./chemical
            test_exe: chemical-tests
          - runner: ubuntu-24.04-arm
            container: alpine:3.20
            asset: linux-alpine-arm64.zip
            release_root: chemical
            exe: ./chemical
            test_exe: chemical-tests
          - runner: ubuntu-24.04-arm
            container: alpine:3.20
            asset: linux-alpine-arm64-tcc.zip
            release_root: chemical-tcc
            exe: ./chemical
            test_exe: chemical-tests

          # ––– macos –––
          - runner: macos-15-intel
            asset: macos-x64.zip
            release_root: chemical
            exe: ./chemical
            test_exe: chemical-tests
          - runner: macos-15-intel
            asset: macos-x64-tcc.zip
            release_root: chemical-tcc
            exe: ./chemical
            test_exe: chemical-tests
          - runner: macos-26
            asset: macos-arm64.zip
            release_root: chemical
            exe: ./chemical
            test_exe: chemical-tests
          - runner: macos-26
            asset: macos-arm64-tcc.zip
            release_root: chemical-tcc
            exe: ./chemical
            test_exe: chemical-tests

          # ––– windows (msvc) –––
          - runner: windows-2025
            asset: windows-x64.zip
            release_root: chemical
            exe: .\chemical.exe
            test_exe: chemical-tests.exe
          - runner: windows-2025
            asset: windows-x64-tcc.zip
            release_root: chemical-tcc
            exe: .\chemical.exe
            test_exe: chemical-tests.exe
          - runner: windows-11-arm
            asset: windows-arm64.zip
            release_root: chemical
            exe: .\chemical.exe
            test_exe: chemical-tests.exe
          - runner: windows-11-arm
            asset: windows-arm64-tcc.zip
            release_root: chemical-tcc
            exe: .\chemical.exe
            test_exe: chemical-tests.exe

          # ––– windows (mingw ucrt) –––
          - runner: windows-2025
            asset: windows-mingw-x64.zip
            release_root: chemical
            exe: .\chemical.exe
            test_exe: chemical-tests.exe
          - runner: windows-2025
            asset: windows-mingw-x64-tcc.zip
            release_root: chemical-tcc
            exe: .\chemical.exe
            test_exe: chemical-tests.exe
          - runner: windows-11-arm
            asset: windows-mingw-arm64.zip
            release_root: chemical
            exe: .\chemical.exe
            test_exe: chemical-tests.exe
          - runner: windows-11-arm
            asset: windows-mingw-arm64-tcc.zip
            release_root: chemical-tcc
            exe: .\chemical.exe
            test_exe: chemical-tests.exe

          # ––– windows (mingw msvcrt) –––
          - runner: windows-2025
            asset: windows-mingw-msvcrt-x64.zip
            release_root: chemical
            exe: .\chemical.exe
            test_exe: chemical-tests.exe
          - runner: windows-2025
            asset: windows-mingw-msvcrt-x64-tcc.zip
            release_root: chemical-tcc
            exe: .\chemical.exe
            test_exe: chemical-tests.exe

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install dependencies (Alpine)
        if: ${{ matrix.container == 'alpine:3.20' }}
        run: apk add --no-cache bash curl jq zip unzip git build-base

      - name: Enable JavaScript actions in Alpine containers
        if: ${{ matrix.container == 'alpine:3.20' }}
        uses: laverdet/alpine-arm64@v1

      - name: Checkout repository (tests)
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
            echo "Using user-specified release tag: $TAG"
          else
            echo "Resolving latest release tag..."
            releases=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
            TAG=$(echo "$releases" | jq -r '[.[] | select(.assets | map(.name) | index("${{ matrix.asset }}"))] | .[0].tag_name')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "Error: no release found with asset ${{ matrix.asset }}."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TARGET_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using release tag: $TAG"

      - name: Checkout release test sources
        if: ${{ !inputs.use_latest_tests }}
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}
          path: release-tests
          fetch-depth: 1

      - name: Clean repository, keep only lang/tests
        run: |
          echo "Cleaning repository: Removing all directories except 'lang'"
          find . -maxdepth 1 -mindepth 1 -type d ! -name "lang" -exec rm -rf {} +
          echo "Inside lang, removing all directories except 'tests'"
          cd lang
          find . -maxdepth 1 -mindepth 1 -type d ! -name "tests" -exec rm -rf {} +
          cd ..
        shell: bash

      - name: Download and extract release asset
        shell: bash
        run: |
          echo "Fetching release information..."
          releases=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
          ASSET_URL=$(echo "$releases" | jq -r '.[] | select(.tag_name == "'"$TARGET_TAG"'") | .assets[] | select(.name=="${{ matrix.asset }}") | .browser_download_url')
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Error: Asset ${{ matrix.asset }} not found."
            exit 1
          fi
          echo "Downloading asset from $ASSET_URL"
          curl -L -o asset.zip "$ASSET_URL"
          unzip -o -q asset.zip || true
          if [ ! -d "${{ matrix.release_root }}" ]; then
            echo "Error: expected directory '${{ matrix.release_root }}' not found."
            exit 1
          fi
          echo "Using release root: ${{ matrix.release_root }}"
          # Copy test sources into the release package if not already present
          if [ ! -d "${{ matrix.release_root }}/lang/tests" ]; then
            mkdir -p "${{ matrix.release_root }}/lang"
            if [ -d "$GITHUB_WORKSPACE/release-tests/lang/tests" ]; then
              cp -r "$GITHUB_WORKSPACE/release-tests/lang/tests" "${{ matrix.release_root }}/lang"
            else
              cp -r "$GITHUB_WORKSPACE/lang/tests" "${{ matrix.release_root }}/lang"
            fi
          fi

      - name: Compile test suite (non-Windows)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          pushd "${{ matrix.release_root }}"
          echo "Running compile command:"
          echo "${{ matrix.exe }} lang/tests/build.lab -arg-minimal -bm -v --assertions --mode debug_complete -o ${{ matrix.test_exe }}"
          ${{ matrix.exe }} lang/tests/build.lab -arg-minimal -bm -v --assertions --mode debug_complete -o ${{ matrix.test_exe }} 2>&1 | tee compile_output.txt
          popd
        shell: bash

      - name: Compile test suite (Windows)
        if: runner.os == 'Windows'
        run: |
          Push-Location "${{ matrix.release_root }}"
          Write-Host "Running compile command:"
          Write-Host "${{ matrix.exe }} lang/tests/build.lab -arg-minimal -bm -v --assertions --mode debug_complete -o ${{ matrix.test_exe }}"
          & ${{ matrix.exe }} lang/tests/build.lab -arg-minimal -bm -v --assertions --mode debug_complete -o ${{ matrix.test_exe }} 2>&1 | Tee-Object -FilePath compile_output.txt
          $compile_rc = $LASTEXITCODE
          Write-Host "compiler exit code: $compile_rc"
          Pop-Location
          if ($compile_rc -ne 0) { exit $compile_rc }
        shell: pwsh

      - name: Run test suite (non-Windows)
        if: runner.os != 'Windows'
        run: |
          pushd "${{ matrix.release_root }}"
          echo "== Running compiled test suite =="
          set +e
          ./${{ matrix.test_exe }} 2>&1 | tee -a compile_output.txt
          RC=${PIPESTATUS[0]}
          set -e
          popd
          exit $RC
        shell: bash

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        run: |
          Push-Location "${{ matrix.release_root }}"
          Write-Host "== Running compiled test suite =="
          $testExe = ".\${{ matrix.test_exe }}"
          if (-not (Test-Path $testExe)) {
            $testExe = ".\chemical-tests"
          }
          & $testExe 2>&1 | Tee-Object -FilePath compile_output.txt -Append
          $run_rc = $LASTEXITCODE
          Write-Host "test suite exit code: $run_rc"
          Pop-Location
          if ($run_rc -ne 0) { exit $run_rc }
        shell: pwsh

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-output
          path: ${{ matrix.release_root }}/compile_output.txt
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # Debug build tests — one job per asset (platform × variant)
  # ─────────────────────────────────────────────────────────────────
  test-debug:
    name: "Debug — ${{ matrix.asset }}"
    if: ${{ inputs.use_debug_builds == 'debug' }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x64-debug.zip
            exe_root: chemical
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            debugger: gdb
            deps: sudo apt-get update && sudo apt-get install -y jq unzip gdb zip binutils file && (sudo sysctl -w kernel.yama.ptrace_scope=0 || true)
          - asset: linux-x64-tcc-debug.zip
            exe_root: chemical-tcc
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            debugger: gdb
            deps: sudo apt-get update && sudo apt-get install -y jq unzip gdb zip binutils file && (sudo sysctl -w kernel.yama.ptrace_scope=0 || true)
          - asset: linux-arm64-debug.zip
            exe_root: chemical
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            debugger: gdb
            deps: sudo apt-get update && sudo apt-get install -y jq unzip gdb zip binutils file && (sudo sysctl -w kernel.yama.ptrace_scope=0 || true)
          - asset: linux-arm64-tcc-debug.zip
            exe_root: chemical-tcc
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            debugger: gdb
            deps: sudo apt-get update && sudo apt-get install -y jq unzip gdb zip binutils file && (sudo sysctl -w kernel.yama.ptrace_scope=0 || true)
          - asset: linux-alpine-x64-debug.zip
            exe_root: chemical
            runner: ubuntu-24.04
            container: alpine:3.20
            platform: linux-alpine
            arch: x64
            debugger: gdb
            deps: apk add --no-cache bash curl jq unzip gdb git coreutils zip build-base file
          - asset: linux-alpine-x64-tcc-debug.zip
            exe_root: chemical-tcc
            runner: ubuntu-24.04
            container: alpine:3.20
            platform: linux-alpine
            arch: x64
            debugger: gdb
            deps: apk add --no-cache bash curl jq unzip gdb git coreutils zip build-base file
          - asset: linux-alpine-arm64-debug.zip
            exe_root: chemical
            runner: ubuntu-24.04-arm
            container: alpine:3.20
            platform: linux-alpine
            arch: arm64
            debugger: gdb
            deps: apk add --no-cache bash curl jq unzip gdb git coreutils zip build-base file
          - asset: linux-alpine-arm64-tcc-debug.zip
            exe_root: chemical-tcc
            runner: ubuntu-24.04-arm
            container: alpine:3.20
            platform: linux-alpine
            arch: arm64
            debugger: gdb
            deps: apk add --no-cache bash curl jq unzip gdb git coreutils zip build-base file
          - asset: macos-arm64-debug.zip
            exe_root: chemical
            runner: macos-26
            platform: macos
            arch: arm64
            debugger: lldb
            deps: brew install jq || true
          - asset: macos-arm64-tcc-debug.zip
            exe_root: chemical-tcc
            runner: macos-26
            platform: macos
            arch: arm64
            debugger: lldb
            deps: brew install jq || true
          - asset: macos-x64-debug.zip
            exe_root: chemical
            runner: macos-15-intel
            platform: macos
            arch: x64
            debugger: lldb
            deps: brew install jq || true
          - asset: macos-x64-tcc-debug.zip
            exe_root: chemical-tcc
            runner: macos-15-intel
            platform: macos
            arch: x64
            debugger: lldb
            deps: brew install jq || true
          - asset: windows-x64-debug.zip
            exe_root: chemical
            runner: windows-2025
            platform: windows
            arch: x64
            debugger: gdb
            deps: choco install gdb -y --no-progress || true
          - asset: windows-x64-tcc-debug.zip
            exe_root: chemical-tcc
            runner: windows-2025
            platform: windows
            arch: x64
            debugger: gdb
            deps: choco install gdb -y --no-progress || true
          - asset: windows-arm64-debug.zip
            exe_root: chemical
            runner: windows-11-arm
            platform: windows
            arch: arm64
            debugger: gdb
            deps: choco install gdb -y --no-progress || true
          - asset: windows-arm64-tcc-debug.zip
            exe_root: chemical-tcc
            runner: windows-11-arm
            platform: windows
            arch: arm64
            debugger: gdb
            deps: choco install gdb -y --no-progress || true

    env:
      DEBUG_REPO: chemicallang/chemical-debug
      SOURCE_REPO: chemicallang/chemical
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      DEADLOCK_TIMEOUT_MINUTES: ${{ inputs.deadlock_timeout_minutes || 10 }}

    steps:
      - name: Enable JavaScript actions in Alpine containers
        if: ${{ matrix.container == 'alpine:3.20' }}
        uses: laverdet/alpine-arm64@v1

      - name: Install dependencies
        run: ${{ matrix.deps }}

      - name: Resolve debug release
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
            echo "Using user-specified debug release tag: $TAG"
          else
            echo "Resolving latest debug build from ${{ env.DEBUG_REPO }}..."
            rel=$(curl -s "https://api.github.com/repos/${{ env.DEBUG_REPO }}/releases?per_page=10")
            TAG=$(echo "$rel" | jq -r '[.[] | select(.assets | length > 0)] | .[0].tag_name')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "::error::no debug builds found in ${{ env.DEBUG_REPO }} — run the Build and Release workflow with a debug config (RelWithDebInfo or Debug)"
              exit 1
            fi
            echo "Latest debug build: $TAG"
          fi
          echo "DEBUG_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Get source commit and test sources from commit.json
        shell: bash
        run: |
          curl -sL -o commit.json "https://github.com/${{ env.DEBUG_REPO }}/releases/download/${DEBUG_TAG}/commit.json"
          SHA=$(jq -r '.sha' commit.json 2>/dev/null)
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::error::commit.json missing a sha — debug release ${DEBUG_TAG} is incomplete"
            exit 1
          fi
          echo "SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          MSG=$(jq -r '.message // ""' commit.json)
          echo "Debug compiler from ${{ env.SOURCE_REPO }} @ ${SHA}: ${MSG}"
          echo "::notice::Debug compiler from commit $SHA (${MSG})"
          curl -sL -o tests.tar.gz "https://github.com/${{ env.SOURCE_REPO }}/archive/${SHA}.tar.gz"
          tar -xzf tests.tar.gz
          mv "chemical-${SHA}/lang/tests" lang_tests
          echo "test sources downloaded from ${SHA}: $(ls lang_tests | wc -l) entries"

      - name: Run debug compiler under debugger
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          CRASHED=0
          DEADLOCKED=0
          : > compile_output.txt
          mkdir -p crash-dump
          echo "debug compiler from ${{ env.SOURCE_REPO }} @ ${SOURCE_SHA} (debug release ${DEBUG_TAG})" | tee -a compile_output.txt

          capture_crash() {
            if [ "${{ matrix.debugger }}" = "lldb" ] && command -v lldb >/dev/null 2>&1; then
              lldb -b \
                -o "run" \
                -o "thread list" \
                -o "thread backtrace all" \
                -o "register read" \
                -o "disassemble --frame" \
                -- $1
            elif command -v gdb >/dev/null 2>&1; then
              gdb -batch \
                -ex "set pagination off" \
                -ex "run" \
                -ex "echo \n=== INFO THREADS ===\n" \
                -ex "info threads" \
                -ex "echo \n=== THREAD APPLY ALL BT FULL ===\n" \
                -ex "thread apply all bt full" \
                -ex "echo \n=== INFO REGISTERS ===\n" \
                -ex "info registers" \
                -ex "echo \n=== DISASSEMBLY AT PC ===\n" \
                -ex "x/32i \$pc" \
                -ex "echo \n=== BT FULL ===\n" \
                -ex "bt full" \
                --args $1
            elif command -v lldb >/dev/null 2>&1; then
              lldb -b \
                -o "run" \
                -o "thread list" \
                -o "thread backtrace all" \
                -o "register read" \
                -- $1
            else
              echo "no debugger (gdb/lldb) available; running directly"
              eval "$1"
            fi
          }

          capture_deadlock() {
            local pid="$1" asset="$2"
            local outdir="crash-dump/deadlock-${asset}"
            mkdir -p "$outdir"

            if command -v gdb >/dev/null 2>&1; then
              gdb -q -nx -batch -p "$pid" \
                -ex "set pagination off" \
                -ex "echo \n===== GDB VERSION =====\n" \
                -ex "show version" \
                -ex "echo \n===== INFO THREADS =====\n" \
                -ex "info threads" \
                -ex "echo \n===== THREAD APPLY ALL BT =====\n" \
                -ex "thread apply all bt" \
                -ex "echo \n===== THREAD APPLY ALL BT FULL =====\n" \
                -ex "thread apply all bt full" \
                -ex "echo \n===== THREAD APPLY ALL INFO REGISTERS =====\n" \
                -ex "thread apply all info registers" \
                -ex "echo \n===== THREAD APPLY ALL INFO FRAME =====\n" \
                -ex "thread apply all info frame" \
                -ex "echo \n===== CURRENT THREAD =====\n" \
                -ex "thread" \
                -ex "echo \n===== SHARED LIBRARIES =====\n" \
                -ex "info sharedlibrary" \
                -ex "echo \n===== INFO PROC =====\n" \
                -ex "info proc" \
                -ex "echo \n===== INFO PROC MAPPINGS =====\n" \
                -ex "info proc mappings" \
                -ex "echo \n===== INFO PROC STATUS =====\n" \
                -ex "info proc status" \
                -ex "echo \n===== INFO FILES =====\n" \
                -ex "info files" \
                -ex "detach" \
                -ex "quit" \
                > "$outdir/gdb_report.txt" 2>&1 || true
              grep -Ei 'error|warning|cannot|unable|no symbol|not available|optimized out|unknown' \
                "$outdir/gdb_report.txt" > "$outdir/gdb_warnings.txt" 2>/dev/null || true
            elif command -v lldb >/dev/null 2>&1; then
              lldb -p "$pid" -b \
                -o "thread list" \
                -o "thread backtrace all" \
                -o "register read" \
                -o "image list" \
                > "$outdir/lldb_report.txt" 2>&1 || true
            else
              echo "no debugger (gdb/lldb) available for deadlock capture" > "$outdir/NO_DEBUGGER.txt"
            fi

            if [ -d "/proc/$pid" ]; then
              {
                echo "===== PROCESS STATUS ====="
                cat "/proc/$pid/status" 2>/dev/null || true
                echo
                echo "===== COMMAND LINE ====="
                tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true
                echo
                echo "===== EXECUTABLE ====="
                readlink -f "/proc/$pid/exe" 2>/dev/null || true
              } > "$outdir/process.txt"
              cat "/proc/$pid/limits" > "$outdir/limits.txt" 2>/dev/null || true
              cat "/proc/$pid/maps"   > "$outdir/memory_maps.txt" 2>/dev/null || true
              cat "/proc/$pid/smaps"  > "$outdir/memory_smaps.txt" 2>/dev/null || true
              {
                echo "===== OPEN FILE DESCRIPTORS ====="
                for FD in /proc/"$pid"/fd/*; do
                  [ -e "$FD" ] && printf "%s -> %s\n" "$FD" "$(readlink "$FD" 2>/dev/null || true)"
                done
              } > "$outdir/file_descriptors.txt"
              mkdir -p "$outdir/threads"
              for TASK in /proc/"$pid"/task/*; do
                TID="$(basename "$TASK")"
                {
                  echo "===== THREAD $TID ====="
                  echo "--- STATUS ---"; cat "$TASK/status" 2>/dev/null || true
                  echo; echo "--- SCHED ---"; cat "$TASK/sched" 2>/dev/null || true
                  echo; echo "--- WCHAN ---"; cat "$TASK/wchan" 2>/dev/null || true
                  echo; echo "--- KERNEL STACK ---"; cat "$TASK/stack" 2>/dev/null || true
                  echo; echo "--- SYSCALL ---"; cat "$TASK/syscall" 2>/dev/null || true
                } > "$outdir/threads/thread_${TID}.txt"
              done
              {
                echo "===== THREAD SUMMARY (wait channels) ====="
                for TASK in /proc/"$pid"/task/*; do
                  [ -d "$TASK" ] || continue
                  TID="$(basename "$TASK")"
                  printf "TID %-10s %s\n" "$TID" "$(cat "$TASK/wchan" 2>/dev/null || echo unknown)"
                done
              } > "$outdir/thread_summary.txt"
              EXE="$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
              if [ -n "$EXE" ] && [ -f "$EXE" ]; then
                {
                  echo "path: $EXE"
                  file "$EXE" 2>/dev/null || true
                  echo "--- ELF HEADER ---"
                  readelf -h "$EXE" 2>/dev/null || true
                  echo "--- BUILD ID ---"
                  readelf -n "$EXE" 2>/dev/null | grep -A2 -i 'Build ID' || true
                } > "$outdir/executable.txt"
              fi
            fi

            {
              echo "===== SYSTEM INFO ====="
              uname -a 2>/dev/null || true
              [ -f /etc/os-release ] && cat /etc/os-release
              echo "platform: ${PLATFORM}-${ARCH}"
              echo "debug release: ${DEBUG_TAG}"
              echo "source commit: ${SOURCE_SHA}"
              echo "deadlock timeout: ${DEADLOCK_TIMEOUT_MINUTES} min"
              echo "asset: $asset"
            } > "$outdir/system.txt"

            {
              echo "DEADLOCK DIAGNOSTIC REPORT"
              echo "=========================="
              echo "asset: $asset"
              echo "pid: $pid"
              echo "generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo
              echo "Collected files:"
              ls -la "$outdir"
            } > "$outdir/README.txt"

            echo "deadlock diagnostics saved to $outdir" | tee -a compile_output.txt
          }

          run_phase() {
            local label="$1" cmd="$2" exe_root="$3" asset="$4" phase="$5"
            local log=/tmp/${phase}_run.log
            local deadline=$((DEADLOCK_TIMEOUT_MINUTES * 60))
            local status=0
            echo "== [$phase] $label: $cmd (deadlock timeout ${DEADLOCK_TIMEOUT_MINUTES} min) ==" | tee -a compile_output.txt
            (
              cd "variant_work/$exe_root"
              exec $cmd
            ) > "$log" 2>&1 &
            local pid=$!
            local start_time=$(date +%s)
            while kill -0 "$pid" 2>/dev/null; do
              local elapsed=$(( $(date +%s) - start_time ))
              if [ "$elapsed" -ge "$deadline" ]; then
                echo "== [$phase] TIMEOUT after ${DEADLOCK_TIMEOUT_MINUTES} min (${elapsed}s) — the $label appears DEADLOCKED; capturing diagnostics ==" | tee -a compile_output.txt
                capture_deadlock "$pid" "${asset}-${phase}"
                DEADLOCKED=1
                CRASHED=1
                cp "$log" "crash-dump/${asset}-${phase}.log.txt"
                cp compile_output.txt crash-dump/compile_output.txt
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                status=124
                break
              fi
              sleep 5
            done
            if [ "$status" != "124" ]; then
              wait "$pid"
              status=$?
            fi
            cat "$log" | tee -a compile_output.txt
            if [ "$status" -ne 0 ] && [ "$DEADLOCKED" != "1" ]; then
              echo "== [$phase] exit $status — the $label CRASHED/FAILED; re-running under ${{ matrix.debugger }} for a backtrace ==" | tee -a compile_output.txt
              local dbgout="crash-dump/${asset}-${phase}.debugger.txt"
              (
                cd "variant_work/$exe_root"
                capture_crash "$cmd"
              ) > "$dbgout" 2>&1
              cat "$dbgout" | tee -a compile_output.txt
              cp "$log" "crash-dump/${asset}-${phase}.log.txt"
              cp compile_output.txt crash-dump/compile_output.txt
              CRASHED=1
            fi
            if [ "$status" -ne 0 ]; then
              echo "================================================================" | tee -a compile_output.txt
              echo " CRASH IDENTIFICATION: the $label crashed" | tee -a compile_output.txt
              echo "   phase : $phase" | tee -a compile_output.txt
              echo "   cmd   : $cmd" | tee -a compile_output.txt
              if [ "$DEADLOCKED" = "1" ]; then
                echo "   cause : DEADLOCK (still running after ${DEADLOCK_TIMEOUT_MINUTES} min)" | tee -a compile_output.txt
              else
                echo "   cause : crashed/failed with exit code $status" | tee -a compile_output.txt
              fi
              echo "================================================================" | tee -a compile_output.txt
            else
              echo "== [$phase] $label completed successfully ==" | tee -a compile_output.txt
            fi
            return $status
          }

          ASSET="${{ matrix.asset }}"
          EXE_ROOT="${{ matrix.exe_root }}"
          echo "== variant: $ASSET ==" | tee -a compile_output.txt
          url=$(curl -s "https://api.github.com/repos/${{ env.DEBUG_REPO }}/releases/tags/${DEBUG_TAG}" \
            | jq -r ".assets[] | select(.name == \"$ASSET\") | .browser_download_url")
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "asset $ASSET not found in debug release ${DEBUG_TAG}; skipping" | tee -a compile_output.txt
            echo "CRASHED=0" >> "$GITHUB_ENV"
            echo "TESTS_RC=0" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sL -o "$ASSET" "$url"
          rm -rf variant_work
          mkdir -p variant_work
          if command -v unzip >/dev/null 2>&1; then
            unzip -o -q "$ASSET" -d variant_work
          elif command -v tar >/dev/null 2>&1; then
            tar -xf "$ASSET" -C variant_work
          else
            python3 -m zipfile -e "$ASSET" variant_work
          fi
          if [ ! -d "variant_work/$EXE_ROOT" ]; then
            echo "extracted package missing expected root '$EXE_ROOT'" | tee -a compile_output.txt
            ls variant_work >> compile_output.txt
            echo "CRASHED=0" >> "$GITHUB_ENV"
            echo "TESTS_RC=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "variant_work/$EXE_ROOT/lang"
          cp -r lang_tests "variant_work/$EXE_ROOT/lang/tests"
          if [ -f "variant_work/$EXE_ROOT/chemical.exe" ]; then
            local exe="./chemical.exe"
          else
            local exe="./chemical"
          fi
          local test_exe="chemical-tests"
          local compile_cmd="$exe lang/tests/build.lab -arg-minimal -bm -v --assertions --mode debug_complete -o $test_exe"
          local run_cmd="./$test_exe"

          echo "##############################################################" | tee -a compile_output.txt
          echo "# PHASE 1/2 — COMPILING the test suite into $test_exe" | tee -a compile_output.txt
          echo "# this phase exercises the COMPILER (build.lab -> executable)" | tee -a compile_output.txt
          echo "##############################################################" | tee -a compile_output.txt
          local phase1_status=0
          run_phase "COMPILER" "$compile_cmd" "$EXE_ROOT" "$ASSET" "compile"
          phase1_status=$?

          echo "##############################################################" | tee -a compile_output.txt
          echo "# PHASE 2/2 — RUNNING the compiled test suite executable" | tee -a compile_output.txt
          echo "# this phase exercises the TEST SUITE (the produced $test_exe)" | tee -a compile_output.txt
          echo "##############################################################" | tee -a compile_output.txt
          local phase2_status=0
          if [ "$phase1_status" -eq 0 ] && [ -f "variant_work/$EXE_ROOT/$test_exe" ]; then
            run_phase "TEST SUITE" "$run_cmd" "$EXE_ROOT" "$ASSET" "run"
            phase2_status=$?
          else
            echo "== skipping phase 2: phase 1 did not produce $test_exe (COMPILER failed)" | tee -a compile_output.txt
            phase2_status=1
          fi

          {
            echo "=== SYSTEM INFO ==="
            uname -a 2>/dev/null || true
            if [ -f /etc/os-release ]; then cat /etc/os-release; fi
            echo "platform: ${PLATFORM}-${ARCH}"
            echo "debug release: ${DEBUG_TAG}"
            echo "source commit: ${SOURCE_SHA}"
            echo "debugger: $(command -v gdb || command -v lldb || echo none)"
            echo "commands:"
            echo "  phase1 (compiler): ./chemical lang/tests/build.lab -arg-minimal -bm -v --assertions --mode debug_complete -o chemical-tests"
            echo "  phase2 (tests):   ./chemical-tests"
          } > crash-dump/system-info.txt

          # CRASHED may already be 1 from run_phase (crash/deadlock detected).
          # Also mark as crashed if either phase exited non-zero.
          if [ "$phase1_status" -ne 0 ] || [ "$phase2_status" -ne 0 ]; then
            CRASHED=1
          fi
          echo "CRASHED=$CRASHED" >> "$GITHUB_ENV"
          TESTS_RC=0
          if [ "$phase1_status" -ne 0 ] || [ "$phase2_status" -ne 0 ]; then
            TESTS_RC=1
          fi
          echo "TESTS_RC=$TESTS_RC" >> "$GITHUB_ENV"
          if [ "$CRASHED" = "1" ]; then
            echo "== final crash identification =="
            grep -E "CRASH IDENTIFICATION: the .* crashed" compile_output.txt || true
            grep -E "   cause : .*" compile_output.txt || true
            if [ "$DEADLOCKED" = "1" ]; then
              echo "test suite DEADLOCKED — packaging crash dump with deadlock diagnostics"
            else
              echo "test suite crashed/failed — packaging crash dump"
            fi
          else
            rm -rf crash-dump
            echo "test suite completed successfully — no crash data uploaded"
          fi
          exit 0

      - name: Package crash dump
        if: env.CRASHED == '1'
        shell: bash
        run: |
          cp commit.json crash-dump/ 2>/dev/null || true
          cp compile_output.txt crash-dump/ 2>/dev/null || true
          if command -v zip >/dev/null 2>&1; then
            zip -r crash-dump.zip crash-dump
          else
            tar -czf crash-dump.zip crash-dump
          fi
          ls -la crash-dump.zip

      - name: Upload crash dump
        if: env.CRASHED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: debug-crash-${{ matrix.asset }}
          path: crash-dump.zip
          if-no-files-found: error

      - name: Mark job failed if tests crashed/failed
        if: env.TESTS_RC != '0'
        shell: bash
        run: |
          echo "::error::test suite crashed, failed, or deadlocked on ${{ matrix.asset }} — see debug-crash-${{ matrix.asset }} artifact"
          exit 1

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Debug compiler tests — ${{ matrix.asset }}"
            echo ""
            echo "**Compiler commit:** \`${SOURCE_SHA}\`"
            echo "**Debug release:** \`${DEBUG_TAG}\`"
            echo ""
            echo "**Test results:**"
            echo '```'
            grep -E "Total [0-9]+ Passed" compile_output.txt || echo "(no Total/Passed/Failed summary found in output)"
            echo '```'
            echo ""
            echo "**Tail of output:**"
            echo '```'
            tail -30 compile_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
